name: Generate Contribution Snake

on:
  schedule:
    # Run once every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  # =============================================================
  # SNAKE CUSTOMIZATION SETTINGS
  # =============================================================
  # 1. Snake Color (Default: #00FFC3 - Cyan / Teal)
  SNAKE_COLOR: "#00FFC3"

  # 2. Snake Animation Speed: "slow" | "medium" | "fast" (Default: "medium")
  #    - slow   : 1.3x duration (relaxed, deliberate movement)
  #    - medium : 1.0x duration (standard smooth default)
  #    - fast   : 0.75x duration (snappy, energetic movement)
  SNAKE_SPEED: "medium"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=${{ env.SNAKE_COLOR }}
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=${{ env.SNAKE_COLOR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Snake Speed Customization (${{ env.SNAKE_SPEED }})
        run: |
          python3 -c "
          import os, re

          speed = os.environ.get('SNAKE_SPEED', 'medium').lower()
          speed_factors = {'slow': 1.3, 'medium': 1.0, 'fast': 0.75}
          factor = speed_factors.get(speed, 1.0)

          if factor != 1.0:
              for filename in ['dist/github-contribution-grid-snake.svg', 'dist/github-contribution-grid-snake-dark.svg']:
                  if os.path.exists(filename):
                      with open(filename, 'r', encoding='utf-8') as f:
                          content = f.read()
                      def replace_ms(match):
                          val = int(match.group(1))
                          return f'{int(val * factor)}ms'
                      new_content = re.sub(r'(\d+)ms', replace_ms, content)
                      with open(filename, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      print(f'Adjusted {filename} for speed: {speed} (factor {factor})')
          else:
              print('Using default smooth medium speed for snake animation.')
          "

      - name: Deploy Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.5.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
